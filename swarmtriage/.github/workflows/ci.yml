name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Byte-compile backend
        run: python -m py_compile $(find backend -name '*.py' -not -path '*/__pycache__/*')
      - name: Smoke tests
        run: python tests/smoke_test.py
      - name: Boot uvicorn and check /api/health
        run: |
          cd backend
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://localhost:8000/api/health > /tmp/health.json; then break; fi
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
      - name: Boot with LLM_PROVIDER=gemini (fallback health check)
        run: |
          cd backend
          LLM_PROVIDER=gemini GEMINI_API_KEY= uvicorn app.main:app --port 8001 &
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://localhost:8001/api/health > /tmp/health-gemini.json; then break; fi
          done
          cat /tmp/health-gemini.json
          grep -q '"status":"ok"' /tmp/health-gemini.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q
