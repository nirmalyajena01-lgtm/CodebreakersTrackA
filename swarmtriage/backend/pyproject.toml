[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmtriage-backend"
version = "0.1.0"
description = "SwarmTriage: Adaptive Enterprise Support Automation — FastAPI swarm backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "openai>=1.58",
    "numpy>=1.26",
    "requests>=2.32",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.3"]

[tool.setuptools.packages.find]
include = ["app*"]
